basePath: /api
definitions:
  health.InfoResponse:
    properties:
      commit:
        example: 2acec66b3b1efbe040f738b18cbb7f60f841fddc
        type: string
      status:
        example: UP
        type: string
      uptime:
        example: 12.666100458s
        type: string
    type: object
info:
  contact: {}
  description: API documentation for Tegami Server.
  title: Tegami API
  version: "0.1"
paths:
  /health:
    get:
      description: Returns the current status of the app.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/health.InfoResponse'
      summary: Get app health
      tags:
      - status
securityDefinitions:
  BearerAuth:
    description: Enter "Bearer <token>" (token from /auth/login).
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
